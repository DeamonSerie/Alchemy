[package]
name = "alchemy-integration"
version = "0.1.0"
edition = "2021"

[dependencies]
frame-support = { version = "49.0.1", default-features = false }
frame-system = { version = "49.0.0", default-features = false }
sp-runtime = { version = "49.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-io = { version = "49.0.0", default-features = false }
codec = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"] }
alchemy-tartarus-primitives = { path = "../../runtime/pallets/alchemy-tartarus-primitives", default-features = false }
alchemy-mirror = { path = "../../runtime/pallets/alchemy-mirror", default-features = false }
alchemy-oubr = { path = "../../runtime/pallets/alchemy-oubr", default-features = false }
alchemy-bundle = { path = "../../runtime/pallets/alchemy-bundle", default-features = false }
alchemy-treasury = { path = "../../runtime/pallets/alchemy-treasury", default-features = false }
alchemy-pricing = { path = "../../runtime/pallets/alchemy-pricing", default-features = false }
alchemy-oracle = { path = "../../runtime/pallets/alchemy-oracle", default-features = false }

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "sp-core/std",
    "sp-io/std",
    "codec/std",
    "scale-info/std",
    "alchemy-tartarus-primitives/std",
    "alchemy-mirror/std",
    "alchemy-oubr/std",
    "alchemy-bundle/std",
    "alchemy-treasury/std",
    "alchemy-pricing/std",
    "alchemy-oracle/std",
]
